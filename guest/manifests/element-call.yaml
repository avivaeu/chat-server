apiVersion: v1
kind: ConfigMap
metadata:
  name: guest-element-call
  namespace: guest-ess
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://matrix.guest-chat.avivaeu.org",
          "server_name": "guest-chat.avivaeu.org"
        }
      },
      "livekit": {
        "livekit_service_url": "https://mrtc.chat.avivaeu.org"
      },
      "features": {
        "feature_use_device_session_member_events": true
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guest-element-call
  namespace: guest-ess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guest-element-call
  template:
    metadata:
      labels:
        app: guest-element-call
    spec:
      containers:
        - name: element-call
          image: ghcr.io/element-hq/element-call:v0.20.0
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: guest-element-call
---
apiVersion: v1
kind: Service
metadata:
  name: guest-element-call
  namespace: guest-ess
spec:
  selector:
    app: guest-element-call
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guest-element-call
  namespace: guest-ess
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - guest-chat.avivaeu.org
      secretName: guest-element-call-tls
  rules:
    - host: guest-chat.avivaeu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: guest-element-call
                port:
                  name: http
