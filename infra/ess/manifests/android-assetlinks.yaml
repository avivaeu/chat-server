apiVersion: v1
kind: ConfigMap
metadata:
  name: ess-assetlinks
  namespace: ess
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /.well-known/assetlinks.json {
        default_type application/json;
        return 200 '[
          {
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "org.avivaeu.chat.debug",
              "sha256_cert_fingerprints": [
                "B0:B0:51:DC:56:5C:81:2F:E1:7F:6F:3E:94:5B:4D:79:04:71:23:AB:0D:A6:12:86:76:9E:B2:94:91:97:13:0E"
              ]
            }
          }
        ]';
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ess-assetlinks
  namespace: ess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ess-assetlinks
  template:
    metadata:
      labels:
        app: ess-assetlinks
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: ess-assetlinks
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: ess-assetlinks
  namespace: ess
spec:
  selector:
    app: ess-assetlinks
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ess-assetlinks
  namespace: ess
spec:
  ingressClassName: traefik
  rules:
    - host: chat.avivaeu.org
      http:
        paths:
          - path: /.well-known/assetlinks.json
            pathType: Exact
            backend:
              service:
                name: ess-assetlinks
                port:
                  name: http
