apiVersion: v1
kind: ConfigMap
metadata:
  name: ess-aasa
  namespace: ess
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /.well-known/apple-app-site-association {
        default_type application/json;
        return 200 '{"webcredentials":{"apps":["ZR769W56HB.org.avivaeu.chat"]}}';
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ess-aasa
  namespace: ess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ess-aasa
  template:
    metadata:
      labels:
        app: ess-aasa
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: ess-aasa
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: ess-aasa
  namespace: ess
spec:
  selector:
    app: ess-aasa
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ess-aasa
  namespace: ess
spec:
  ingressClassName: traefik
  rules:
    - host: chat.avivaeu.org
      http:
        paths:
          - path: /.well-known/apple-app-site-association
            pathType: Exact
            backend:
              service:
                name: ess-aasa
                port:
                  name: http
