apiVersion: v1
kind: ConfigMap
metadata:
  name: sygnal-config
  namespace: ess
data:
  sygnal.yaml: |
    log:
      setup:
        version: 1
        formatters:
          normal:
            format: "%(asctime)s [%(process)d] %(levelname)-5s %(name)s %(message)s"
        handlers:
          stderr:
            class: logging.StreamHandler
            formatter: normal
            stream: ext://sys.stderr
          stdout:
            class: logging.StreamHandler
            formatter: normal
            stream: ext://sys.stdout
        loggers:
          sygnal.access:
            propagate: false
            handlers: [stdout]
            level: INFO
          sygnal:
            propagate: false
            handlers: [stderr]
            level: INFO
        root:
          handlers: [stderr]
          level: INFO
        disable_existing_loggers: false

    http:
      bind_addresses: ["0.0.0.0"]
      port: 5000

    apps:
      # Primary production app_id used by current Aviva Element X iOS builds.
      org.avivaeu.chat.ios.prod:
        type: apns
        keyfile: /sygnal/secrets/apns/AuthKey.p8
        key_id: 3G8AAK4D9X
        team_id: ZR769W56HB
        topic: org.avivaeu.chat
        platform: production

      # Temporary migration fallback for previously-published builds.
      # Remove once all active users are on org.avivaeu.chat.ios.prod.
      org.avivaeu.chat:
        type: apns
        keyfile: /sygnal/secrets/apns/AuthKey.p8
        key_id: 3G8AAK4D9X
        team_id: ZR769W56HB
        topic: org.avivaeu.chat
        platform: production
