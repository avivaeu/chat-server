apiVersion: v1
kind: Secret
metadata:
  name: sygnal-fcm
  namespace: ess
type: Opaque
stringData:
  # Firebase service account JSON for FCM v1.
  # Keep real credentials out of git.
  service-account.json: |
    {
      "type": "service_account",
      "project_id": "REPLACE_WITH_FIREBASE_PROJECT_ID",
      "private_key_id": "REPLACE_WITH_PRIVATE_KEY_ID",
      "private_key": "-----BEGIN PRIVATE KEY-----\\nREPLACE_WITH_PRIVATE_KEY\\n-----END PRIVATE KEY-----\\n",
      "client_email": "REPLACE_WITH_SERVICE_ACCOUNT_EMAIL",
      "client_id": "REPLACE_WITH_CLIENT_ID",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "REPLACE_WITH_CLIENT_CERT_URL"
    }
