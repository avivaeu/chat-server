apiVersion: v1
kind: Secret
metadata:
  name: sygnal-apns
  namespace: ess
type: Opaque
stringData:
  # Apple APNs auth key (.p8). Keep real key out of git.
  # Replace with your real key contents before applying.
  AuthKey.p8: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_REAL_APNS_P8_KEY
    -----END PRIVATE KEY-----
