# NOTE (next fresh deploy): size persistent storage to <=80% of node disk.
# Example target on this VM class:
# postgres.storage.size: 8Gi
# synapse.media.storage.size: 16Gi

postgres:
  storage:
    size: 12Gi

matrixAuthenticationService:
  additional:
    auth.yaml:
      config: |
        account:
          password_registration_enabled: true
          registration_token_required: true
          password_registration_email_required: false
          password_recovery_enabled: true
          login_with_email_allowed: true
          password_change_allowed: true

        upstream_oauth2:
          providers:
            - id: 01KS3C39WPPD1N8TEKD3Z41718
              human_name: Aviva ID
              issuer: https://aviva-uhb17i.eu1.zitadel.cloud
              client_id: "373809136183293086"
              client_secret: "__SET_ZITADEL_CLIENT_SECRET__"
              token_endpoint_auth_method: client_secret_post
              scope: "openid profile email"
              fetch_userinfo: true
              claims_imports:
                localpart:
                  action: require
                  template: "{{ user.preferred_username }}"
                  on_conflict: set
                displayname:
                  action: suggest
                  template: "{{ user.name }}"
                email:
                  action: suggest
                  template: "{{ user.email }}"

synapse:
  media:
    maxUploadSize: 5M
    storage:
      size: 50Gi
  additional:
    retention.yaml:
      config: |
        retention:
          enabled: true
          default_policy:
            min_lifetime: 1d
            max_lifetime: 30d
          allowed_lifetime_min: 1d
          allowed_lifetime_max: 30d
          purge_jobs:
            - longest_max_lifetime: 30d
              interval: 12h
            - shortest_max_lifetime: 30d
              interval: 1d
